apiVersion: addons.kubestash.com/v1alpha1
kind: Addon
metadata:
  name: kubevirt-addon
spec:
  backupTasks:
  - name: logical-backup
    function: kubevirt-logical-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: snapshotReadyTimeout
      required: false
      default: 10m
      usage: wait for the VirtualMachineSnapshot to become readyToUse (running VMs)
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  - name: manifest-backup
    function: kubevirt-manifest-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  - name: volume-backup
    function: kubevirt-volume-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: snapshotReadyTimeout
      required: false
      default: 10m
      usage: wait for the VirtualMachineSnapshot to become readyToUse (running VMs)
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  restoreTasks:
  - name: logical-restore
    function: kubevirt-logical-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: components
      required: false
      usage: restore only the listed volume components
    - name: overrideResources
      required: false
      default: 'false'
  - name: volume-restore
    function: kubevirt-volume-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: components
      required: false
      usage: restore only the listed volume components
  - name: manifest-restore
    function: kubevirt-manifest-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: overrideResources
      required: false
      default: 'false'
