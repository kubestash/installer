apiVersion: addons.kubestash.com/v1alpha1
kind: Addon
metadata:
  name: kubevirt
spec:
  backupTasks:
  - name: logical-backup
    function: kubevirt-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: snapshotReadyTimeout
      required: false
      default: 10m
      usage: wait for the VirtualMachineSnapshot to become readyToUse (running VMs)
  - name: backupMode
    required: false
    default: vmsnapshot
    usage: 'Hot-backup mechanism for a running VM: vmsnapshot | cbt | auto'
  - name: forceFull
    required: false
    default: 'false'
    usage: Force a full CBT backup even when a checkpoint exists (required while data lands in restic)
  - name: cbtScratchStorageClass
    required: false
    usage: StorageClass for the scratch PVC a CBT backup requires (empty = cluster default)
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  - name: manifest-backup
    function: kubevirt-manifest-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  - name: volume-backup
    function: kubevirt-volume-backup
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: snapshotReadyTimeout
      required: false
      default: 10m
      usage: wait for the VirtualMachineSnapshot to become readyToUse (running VMs)
  - name: backupMode
    required: false
    default: vmsnapshot
    usage: 'Hot-backup mechanism for a running VM: vmsnapshot | cbt | auto'
  - name: forceFull
    required: false
    default: 'false'
    usage: Force a full CBT backup even when a checkpoint exists (required while data lands in restic)
  - name: cbtScratchStorageClass
    required: false
    usage: StorageClass for the scratch PVC a CBT backup requires (empty = cluster default)
    - name: enableCache
      required: false
      default: 'true'
    - name: scratchDir
      required: false
      default: /kubestash-tmp
    volumeMounts:
    - name: kubestash-tmp-volume
      mountPath: /kubestash-tmp
    volumeTemplate:
    - name: kubestash-tmp-volume
      source:
        emptyDir: {}
  restoreTasks:
  - name: logical-restore
    function: kubevirt-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: components
      required: false
      usage: restore only the listed volume components
    - name: overrideResources
      required: false
      default: 'false'
  - name: volume-restore
    function: kubevirt-volume-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: components
      required: false
      usage: restore only the listed volume components
  - name: manifest-restore
    function: kubevirt-manifest-restore
    driver: Restic
    executor: Job
    singleton: true
    parameters:
    - name: overrideResources
      required: false
      default: 'false'
