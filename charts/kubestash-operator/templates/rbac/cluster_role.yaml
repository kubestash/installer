apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubestash-operator.fullname" . }}
  labels:
    {{- include "kubestash-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs: ["get", "create", "patch", "update"]
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["*"]
  - apiGroups:
      - core.kubestash.com
      - kubedb.com
      - snapshot.storage.k8s.io
    resources:
      - "*"
    verbs: ["*"]
  - apiGroups:
      - ops.kubedb.com
    resources:
      - solropsrequests
    verbs: ["get", "create", "patch", "delete"]
  # KubeVirt VirtualMachine backup/restore: read access resolves the target, and the
  # rest must stay a superset of the pkg/rbac job roles the operator grants.
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachineinstances
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - backup.kubevirt.io
    resources:
      - virtualmachinebackups
      - virtualmachinebackuptrackers
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups:
      - snapshot.kubevirt.io
    resources:
      - virtualmachinesnapshots
      - virtualmachinesnapshotcontents
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datavolumes
    verbs: ["get", "list", "create"]
  - apiGroups:
      - instancetype.kubevirt.io
    resources:
      - virtualmachineinstancetypes
      - virtualmachineclusterinstancetypes
      - virtualmachinepreferences
      - virtualmachineclusterpreferences
    verbs: ["get", "list"]
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
    verbs: ["get", "list", "create"]
  - apiGroups:
      - storage.kubestash.com
    resources:
      - "*"
    verbs: ["*"]
  - apiGroups:
      - appcatalog.appscode.com
    resources:
      - "*"
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - config.kubestash.com
    resources:
      - "*"
    verbs: ["*"]
  - apiGroups:
      - addons.kubestash.com
    resources:
      - "*"
    verbs: [ "*" ]
  - apiGroups:
      - ""
    resources:
      - events
    verbs: ["create"]
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create"]
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch", "create", "patch", "delete", "update"]
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - ""
    resources:
      - services
    verbs: ["get", "list", "watch","create"]
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs: ["create"]
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs: ["get", "list", "create", "patch", "watch", "delete"]
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs: ["get", "create"]
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
      - rolebindings
      - clusterrolebindings
    verbs: ["get","list", "watch", "create", "delete", "patch", "update"]
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs: ["get","delete"]
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - clusterclaims
    verbs: ["get"]
    resourceNames: ["features.ace.info"]
  - apiGroups:
      - catalog.kubedb.com
    resources:
      - elasticsearchs
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - appcatalog.appscode.com
    resources:
      - appbindings
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - elasticsearch.kubedb.com
    resources:
      - elasticsearchdashboards
    verbs: ["list"]
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs: [ "get", "create"]
  - apiGroups:
      - archiver.kubedb.com
    resources:
      - "*"
    verbs: [ "get", "create" ]
  - apiGroups:
      - batch.k8s.appscode.com
    resources:
      - pendingtasks
    verbs: [ "create", "get", "list", "watch", "patch" ]
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - kubevault.com
    resources:
      - vaultservers
    verbs: [ "get", "list", "watch" ]
  - apiGroups:
      - virtual-secrets.dev
    resources:
      - secrets
      - secrets/mount
    verbs: [ "get", "list", "watch" ]
