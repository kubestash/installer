{{- if eq "prometheus.io/operator" ( include "monitoring.agent" . ) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kubestash-ui-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- if eq "true" ( include "monitoring.apply-servicemonitor-label" . ) }}
    {{- include "monitoring.servicemonitor-label" . | nindent 4 }}
  {{- else }}
    {{- include "kubestash-ui-server.selectorLabels" . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "kubestash-ui-server.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: api
    authorization:
      type: Bearer
      credentials:
        name: {{ printf "%s-metrics-token" (include "kubestash-ui-server.fullname" .) }}
        key: token
    scheme: https
    tlsConfig:
      ca:
        secret:
          name: {{ include "kubestash-ui-server.fullname" . }}-apiserver-cert
          key: ca.crt
      serverName: "{{ include "kubestash-ui-server.fullname" . }}.{{ .Release.Namespace }}.svc"
{{- end }}
