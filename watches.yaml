# Use the 'create api' subcommand to add watches to this file.
- group: installer.kubestash.com
  version: v1
  kind: Kubestash
  chart: helm-charts/kubestash
  watchDependentResources: false
  dryRunOption: server
  overrideValues:
    kubestash-operator.apiserver.servingCerts.certManager.enabled: true
