apiVersion: installer.kubestash.com/v1
kind: Kubestash
metadata:
  name: kubestash-sample
spec:
  nameOverride: ''
  fullnameOverride: ''
  global:
    license: ''
    registry: ''
    registryFQDN: ''
    imagePullSecrets: []
    skipCleaner: false
    taskQueue:
      enabled: false
      maxConcurrentSessions: 10
    networkPolicy:
      enabled: false
      flavor: kubernetes
    distro:
      openshift: false
      ubi: all
  kubestash-operator:
    enabled: true
    nameOverride: ''
    fullnameOverride: ''
    replicaCount: 1
    license: ''
    registryFQDN: ghcr.io
    taskQueue:
      enabled: false
      maxConcurrentSessions: 10
    operator:
      registry: kubestash
      repository: kubestash
      tag: ''
      resources:
        requests:
          cpu: 100m
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
    cleaner:
      registry: appscode
      repository: kubectl-nonroot
      tag: '1.34'
      skip: false
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      affinity: {}
    imagePullSecrets: []
    imagePullPolicy: IfNotPresent
    criticalAddon: false
    logLevel: 3
    annotations: {}
    podAnnotations: {}
    podLabels: {}
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    affinity: {}
    podSecurityContext:
      fsGroup: 65535
    serviceAccount:
      create: true
      annotations: {}
      name: null
    apiserver:
      groupPriorityMinimum: 10000
      versionPriority: 15
      enableMutatingWebhook: true
      enableValidatingWebhook: true
      bypassValidatingWebhookXray: false
      useKubeapiserverFqdnForAks: true
      healthcheck:
        enabled: false
      servingCerts:
        generate: true
        certManager:
          enabled: false
          issuerRef:
            name: ''
            kind: Issuer
            group: cert-manager.io
        caCrt: ''
        serverCrt: ''
        serverKey: ''
    monitoring:
      agent: none
      backup: false
      operator: false
      serviceMonitor:
        labels: {}
    security:
      apparmor:
        enabled: false
      seccomp:
        enabled: false
    distro:
      openshift: false
      ubi: all
    networkPolicy:
      enabled: false
      flavor: kubernetes
    netVolAccessor:
      cpu: 100m
      memory: 128Mi
      runAsUser: 2000
      privileged: false
    envFrom: []
    env: []
  kubestash-catalog:
    enabled: true
    proxies:
      ghcr: ghcr.io
    waitTimeout: 300
    kubedump:
      enabled: true
      backup:
        sanitize: true
        labelSelector: ''
        includeDependants: false
    kubevirt:
      enabled: true
    pvc:
      enabled: true
    volumesnapshot:
      enabled: true
    workload:
      enabled: true
    manifest:
      enabled: true
    vault:
      enabled: true
    distro:
      openshift: false
      ubi: all
  kubestash-metrics: null
  ace-user-roles:
    enabled: true
    enableClusterRoles:
      ace: false
      appcatalog: true
      audit: true
      catalog: false
      cert-manager: false
      kubedb-ui: false
      kubedb: false
      kubestash: true
      kubevault: false
      license-proxyserver: true
      metrics: true
      prometheus: false
      secrets-store: false
      stash: false
      virtual-secrets: false
  registryFQDN: ghcr.io
  tester:
    registry: appscode
    repository: kubectl-nonroot
    tag: '1.34'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    resources: {}
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  podLabels: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
