# This rule is not used by the project kubestash-installer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over installer.kubestash.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubestash-installer
    app.kubernetes.io/managed-by: kustomize
  name: kubestash-admin-role
rules:
- apiGroups:
  - installer.kubestash.com
  resources:
  - kubestashs
  verbs:
  - '*'
- apiGroups:
  - installer.kubestash.com
  resources:
  - kubestashs/status
  verbs:
  - get
