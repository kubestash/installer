apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for installer.kubestash.com/v1, Kind: Kubestash
##
- apiGroups:
  - installer.kubestash.com
  resources:
  - kubestashs
  - kubestashs/status
  - kubestashs/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "serviceaccounts"
  - "services"
- verbs:
  - "*"
  apiGroups:
  - "apps"
  resources:
  - "deployments"

- verbs:
  - "*"
  apiGroups:
  - "cert-manager.io"
  resources:
  - "issuers"
  - "certificates"
- verbs:
  - "*"
  apiGroups:
  - "security.openshift.io"
  resources:
  - "securitycontextconstraints"

- verbs:
  - "escalate"
  - "bind"
  apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "clusterroles"
  - "roles"

# +kubebuilder:scaffold:rules
